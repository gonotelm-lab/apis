name: sync-clients
on:
  push:
    branches:
      - "**"
    tags:
      - "*"

# Serialize per ref: one in progress, at most one pending (newer pending replaces older pending).
# cancel-in-progress:false => queue instead of cancel the running run.
concurrency:
  group: apis-client-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  branch-sync:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/reusable-generate-sync.yml
    with:
      branch: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  tag-sync:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/reusable-generate-sync.yml
    with:
      branch: main
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      tag_only: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
