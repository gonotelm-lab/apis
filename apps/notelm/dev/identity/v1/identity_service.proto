syntax = "proto3";

package apps.notelm.dev.identity.v1;

import "apps/notelm/dev/identity/v1/user.proto";

option go_package = "github.com/gonotelm-lab/apis-go-client/apps/notelm/dev/identity/v1;identity";

service IdentityService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
}
