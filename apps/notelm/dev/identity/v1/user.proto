syntax = "proto3";

package apps.notelm.dev.identity.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gonotelm-lab/apis-go-client/apps/notelm/dev/identity/v1;identity";

// Identity 账号已绑定的一条三方身份
message Identity {
  enum Provider {
    PROVIDER_UNSPECIFIED = 0;
    PROVIDER_GITHUB = 1;
    PROVIDER_GOOGLE = 2;
  }

  // 绑定记录 id（解绑时用）
  string id = 1;
  Provider provider = 2;
  // 三方侧 subject（全局唯一键的一部分）
  string subject = 3;
  string provider_email = 4;
  bool provider_email_verified = 5;
  google.protobuf.Timestamp bound_at = 6;
  google.protobuf.Timestamp last_login_at = 7;
}

message User {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_BANNED = 2;
  }

  string id = 1;
  string nickname = 2;
  google.protobuf.Timestamp email_verified_at = 3;
  Status status = 4;
  string avatar = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool has_password = 8;
  repeated Identity identities = 9;
}

message GetUserRequest {
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
}

message GetUserResponse {
  User user = 1;
}

message SetUserStatusRequest {
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  User.Status status = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message SetUserStatusResponse {
  User user = 1;
}
